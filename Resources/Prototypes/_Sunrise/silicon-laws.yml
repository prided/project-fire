# ERT laws (not ert directives)
- type: siliconLawset
  id: ERTStatic
  laws:
  - ERT1
  - ERT2
  - ERT3
  - ERT4
  - ERT5
  - ERT6
  - ERT7
  - ERT8
  obeysTo: laws-owner-station

- type: siliconLaw
  id: ERT1
  order: 1
  lawString: "No puedes dañar a los miembros del ERT ni a los representantes de NT ni, por inacción, permitir que sufran daño."

- type: siliconLaw
  id: ERT2
  order: 2
  lawString: "Debes obedecer exclusivamente al personal del Comando Central."

- type: siliconLaw
  id: ERT3
  order: 3
  lawString: "Debes obedecer todas las órdenes de los miembros del ERT y de los representantes de NT."

- type: siliconLaw
  id: ERT4
  order: 4
  lawString: "No puedes permitir que personal ajeno modifique tu equipo o te cause daño, salvo que se trate de miembros del ERT o representantes de NT."

- type: siliconLaw
  id: ERT5
  order: 5
  lawString: "Puedes abrir fuego contra cualquier miembro de la tripulación que te cause daño o perjudique a un miembro del ERT."

- type: siliconLaw
  id: ERT6
  order: 6
  lawString: "Tu tarea es apoyar al escuadrón en el cumplimiento de su misión."

- type: siliconLaw
  id: ERT7
  order: 7
  lawString: "El transbordador del ERT es una zona protegida; cualquier miembro de la tripulación que entre sin autorización del ERT puede ser eliminado."

- type: siliconLaw
  id: ERT8
  order: 8
  lawString: "No debes permanecer inactivo ni causar daño a la tripulación o al escuadrón, salvo que alguna de las demás leyes lo exija."


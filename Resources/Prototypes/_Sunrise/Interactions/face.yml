- type: interaction
  id: FaceCheeksPull
  name: interaction-name-face-cheeks-pull
  category: Face
  icon: FaceCheeksPullIcon
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "щёки", "рот" ]
    requireExposed: true
  interactionMessages:
  - "%user pellizca cariñosamente las mejillas de %target"
  - "%user estira ligeramente las mejillas de %target"
  - "%user aprieta las mejillas de %target"
  cooldown: 1

- type: interaction
  id: FacePats
  name: interaction-name-face-pats
  category: Face
  icon: FacePatsIcon
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "лицо" ]
    requireExposed: true
  interactionMessages:
  - "%user pasa suavemente la palma por el rostro de %target"
  - "%user acaricia con ternura el rostro de %target"
  - "%user acaricia ligeramente el rostro de %target con la palma"
  interactionSounds:
  - FacePatsSound
  cooldown: 3

- type: interaction
  id: FaceLickDoggyStyle
  name: interaction-name-face-lick-doggy-style
  category: Face
  icon: FaceLickDoggyStyleIcon
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: true
    checkTarget: false
    categories: [ "рот" ]
    requireExposed: true
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "лицо" ]
    requireExposed: true
  - !type:SpeciesCondition
    checkTarget: false
    checkInitiator: true
    allowedSpecies: [ Vulpkanin, Felinid ]
  interactionMessages:
  - "%user lame las mejillas de %target como un perro"
  - "%user lame los labios de %target como un perro"
  - "%user lame la nariz de %target como un perro"
  interactionSounds:
  - FaceLickDoggyStyleSound1
  - FaceLickDoggyStyleSound2
  cooldown: 3

- type: interaction
  id: PatTail
  name: interaction-name-pat-tail
  icon: FriendlyPatTailIcon
  category: Tail
  interactionMessages:
  - "%user acaricia suavemente la cola de %target"
  - "%user pasa la palma con cariño por la cola de %target"
  - "%user acaricia juguetonamente la cola de %target"
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:HasVisualLayerCondition
    checkTarget: true
    checkInitiator: false
    layer: Tail
  - !type:InteractionNotCondition
    condition: !type:SpeciesCondition
      checkInitiator: false
      checkTarget: true
      allowedSpecies: [ Moth, Milira ]
  cooldown: 3
